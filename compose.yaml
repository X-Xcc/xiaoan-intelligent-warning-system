name: xiaoan

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xiaoan
      POSTGRES_USER: xiaoan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run start.cmd or python3 deploy/configure.py first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaoan -d xiaoan"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://xiaoan:${POSTGRES_PASSWORD}@db:5432/xiaoan
      CICSIC_ADMIN_TOKEN: ${CICSIC_ADMIN_TOKEN:?Deployment admin token is required}
      CICSIC_ADMIN_AUTH_ENABLED: "true"
      CICSIC_BRIDGE_DATA_DIR: /app/server/.secrets/device-bridges
      CICSIC_EVIDENCE_DIR: /app/server/data/event-evidence
      SECURITY_DETECTION_DATA_DIRS: /app/server/security-data
      SECURITY_MODEL_PATH: /app/server/models/yolov8n-pose.pt
      SECURITY_VIDEO_BASE_URL: ${SECURITY_VIDEO_BASE_URL:-http://127.0.0.1:5000}
      SECURITY_VLM_BASE_URL: ${SECURITY_VLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      SECURITY_VLM_MODEL: ${SECURITY_VLM_MODEL:-qwen-vl-plus}
      SECURITY_VLM_API_KEY: ${SECURITY_VLM_API_KEY:-}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-}
    volumes:
      - evidence:/app/server/data
      - bridge-secrets:/app/server/.secrets
      - detection-data:/app/server/security-data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health/ready"]
      interval: 10s
      timeout: 6s
      retries: 12
    restart: unless-stopped

volumes:
  database:
  evidence:
  bridge-secrets:
  detection-data:
