server.port=${PORT:5000}
server.address=0.0.0.0
server.servlet.context-path=/
spring.application.name=yolov8-security
spring.web.resources.static-locations=file:../web/dist/
spring.web.resources.cache.period=0
app.file.upload-dir=${DATA_DIR:./data}
app.file.video-dir=${VIDEO_DIR:../videos}
app.file.model-dir=${MODEL_DIR:../models}
app.file.result-dir=${RESULT_DIR:../results}
app.camera-config-path=${CAMERAS_CONFIG_PATH:../runtime/cameras.json}
app.monitor.timeout=300
app.monitor.max-recent-detections=20
app.monitor.max-recent-frames=5
app.python.script-path=${DETECTOR_SCRIPT_PATH:../detection/yolov8_security.py}
app.python.executable=${DETECTOR_PYTHON:python}
app.python.auto-start=${DETECTOR_AUTOSTART:false}
app.qwenVl.service-url=${QWEN_VL_SERVICE_URL:http://127.0.0.1:5002}
app.qwenVl.model-path=${QWEN_VL_MODEL_PATH:../models/Qwen2.5-VL-7B-Instruct}
app.qwenVl.timeout=30000
app.qwenVl.max-retries=3
app.api-key=${API_KEY:}
app.jwt.secret=${JWT_SECRET:}
app.jwt-secret=${JWT_SECRET:}
app.jwt.expiration=86400000
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin-username=${ADMIN_USERNAME:}
app.admin-password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${DETECTOR_ALLOWED_ORIGINS:http://localhost:5000,http://127.0.0.1:5000}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
app.video.stream-poll-interval-ms=16
app.video.no-frame-poll-interval-ms=200
app.video.frame-ttl-ms=30000
app.cleanup.retention-days=${DETECTOR_RETENTION_DAYS:0}
app.demo-mode=false
app.demo.enabled=false
app.demo.detection-interval-ms=6000
app.demo.camera-count=16
app.fake-alert.enabled=false
app.fake-alert.min-count=10
app.fake-alert.max-count=15
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/db/cameras;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DETECTOR_DB_USERNAME:sa}
spring.datasource.password=${DETECTOR_DB_PASSWORD:}
spring.h2.console.enabled=false
spring.sql.init.mode=always
app.security.csp.extra-img-src=
app.go2rtc.auto-start=${GO2RTC_AUTOSTART:false}
app.go2rtc.sync-enabled=${GO2RTC_SYNC_ENABLED:true}
app.go2rtc.binary-path=${GO2RTC_BINARY:go2rtc}
app.go2rtc.api-host=${GO2RTC_API:http://127.0.0.1:1984}
app.go2rtc.rtsp-host=${GO2RTC_RTSP_HOST:rtsp://127.0.0.1:8554}
app.go2rtc.api-port=1984
app.go2rtc.rtsp-port=8554
app.go2rtc.webrtc-port=8555
app.camera.snapshot.enabled=${SNAPSHOT_ENABLED:false}
app.camera.snapshot.id=${SNAPSHOT_CAMERA_ID:http-snapshot}
app.camera.snapshot.address=${SNAPSHOT_ADDRESS:}
app.camera.snapshot.interval-ms=1000
app.camera.snapshot.connect-timeout-ms=5000
app.camera.snapshot.read-timeout-ms=5000
app.camera.snapshot.username=${SNAPSHOT_USERNAME:}
app.camera.snapshot.password=${SNAPSHOT_PASSWORD:}
