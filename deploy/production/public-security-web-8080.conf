server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /www/wwwroot/public-security-web;
    index index.html;
    client_max_body_size 25m;

    location = / {
        return 302 /public-security/;
    }

    location = /public-security {
        return 302 /public-security/;
    }

    location = /public-security/index.html {
        alias /www/wwwroot/public-security-web/index.html;
        add_header Cache-Control "no-cache";
    }

    location /public-security/api/ {
        proxy_pass http://127.0.0.1:8011/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /public-security/ {
        alias /www/wwwroot/public-security-web/;
        try_files $uri $uri/ /public-security/index.html;
    }

    location / {
        try_files $uri =404;
    }
}
