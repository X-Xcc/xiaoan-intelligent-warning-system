name: 功能建议
description: 提议一个可验证的新功能或改进
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述当前流程中的痛点和受影响的使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述你希望系统如何工作，并说明可能的替代方案。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 用可验证的条目描述完成后的行为。
